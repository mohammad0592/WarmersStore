# Local development services.
#   docker compose up -d db                   -> PostgreSQL only (run API/web with dotnet/npm)
#   docker compose --profile app up --build   -> also runs the production image on :8088
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: warmers
      POSTGRES_USER: warmers
      POSTGRES_PASSWORD: warmers_dev # local development only
    ports:
      - "5433:5432" # 5433 on the host avoids clashing with a locally installed PostgreSQL
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U warmers -d warmers"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    profiles: ["app"]
    build: .
    image: warmersstore:local
    environment:
      ConnectionStrings__Default: Host=db;Port=5432;Database=warmers;Username=warmers;Password=warmers_dev
    ports:
      - "8088:8080" # 8088 on the host: 8080 is often taken (e.g. Oracle XE listener)
    volumes:
      - media:/data/media
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  media:
